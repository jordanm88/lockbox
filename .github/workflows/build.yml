name: Build Lockbox

permissions:
  contents: write

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      publish_release:
        description: 'If true, create a draft GitHub release with the build artifacts (disabled by default)'
        required: false
        default: 'false'

jobs:
  build:
    strategy:
      fail-fast: false
      # A specific Ubuntu version is pinned rather than ubuntu-latest so the
      # .deb's glibc requirement doesn't silently creep up whenever GitHub
      # bumps the default runner's Ubuntu version — a .deb built against a
      # newer glibc than a user's system ships refuses to install there.
      #
      # ubuntu-24.04, not ubuntu-22.04: the AppImage bundles its build
      # system's actual webkit2gtk/GLib/Mesa (not just links against them at
      # runtime), and that stack is specifically the one most sensitive to
      # "built old, run new" version skew — on 22.04 (GLib 2.72, ~2022) that
      # bundle is old enough to fail outright (EGL display creation errors,
      # GIO module symbol mismatches) on a current host system, even though
      # the exact same host has a perfectly working native GPU/EGL stack.
      # 24.04 narrows the .deb's glibc floor slightly in exchange for an
      # AppImage that actually works on anything reasonably current — a
      # trade worth making since a broken AppImage is worse than a marginally
      # newer glibc requirement.
      matrix:
        platform: [windows-latest, ubuntu-24.04]
    runs-on: ${{ matrix.platform }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Tauri's Linux build links against webkit2gtk/GTK3 at compile time
      # (via wry/rfd) — none of this is needed on Windows, where Tauri uses
      # the OS's own WebView2 instead.
      - name: Install Linux build prerequisites
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            build-essential \
            libssl-dev

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri"

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install frontend dependencies
        run: npm ci

      - name: Type-check frontend
        run: npx tsc --noEmit

      # Plain `tauri build`, not tauri-action — keeps this job's only
      # responsibility "produce bundles for this OS", with no dependence on
      # GitHub-release-specific behavior that's harder to verify locally.
      - name: Build Tauri app
        run: npm run tauri -- build

      # Tauri's AppImage bundler (linuxdeploy) over-bundles a handful of
      # libraries that must come from the host system, not be shipped inside
      # the AppImage — see https://github.com/tauri-apps/tauri/issues/15665.
      # The worst offender is libwayland-client: bundling it makes
      # eglGetDisplay(EGL_DEFAULT_DISPLAY) fail with EGL_BAD_PARAMETER
      # against any host Mesa newer than this runner's, which aborts
      # WebKitWebProcess before it ever paints anything — the window opens
      # but stays permanently blank, with nothing in the console to explain
      # why (confirmed by hand: stripping these same libraries from a built
      # AppImage and re-running it is the difference between
      # WebKitWebProcess aborting on EGL init and it running normally with a
      # real GPU render-node handle open). Tauri has no config knob for this
      # yet, so it's fixed here: extract, delete the offending libraries (so
      # the dynamic linker falls through to the host's own, which is what a
      # correctly-built AppImage should rely on for anything this
      # display-server/kernel-adjacent anyway), repackage with the same
      # tool the community pkg2appimage excludelist is built around.
      - name: Fix over-bundled AppImage libraries (Mesa 25+ EGL compatibility)
        if: runner.os == 'Linux'
        run: |
          set -e
          appimage_path=$(find "$PWD/src-tauri/target/release/bundle/appimage" -name "*.AppImage" | head -1)
          if [ -z "$appimage_path" ]; then
            echo "no AppImage found under bundle/appimage — skipping" >&2
            exit 0
          fi

          chmod +x "$appimage_path"
          workdir=$(mktemp -d)
          (cd "$workdir" && "$appimage_path" --appimage-extract >/dev/null)

          rm -f "$workdir"/squashfs-root/usr/lib/libwayland-client.so* \
                "$workdir"/squashfs-root/usr/lib/libwayland-server.so* \
                "$workdir"/squashfs-root/usr/lib/libglib-2.0.so* \
                "$workdir"/squashfs-root/usr/lib/libgio-2.0.so* \
                "$workdir"/squashfs-root/usr/lib/libgobject-2.0.so* \
                "$workdir"/squashfs-root/usr/lib/libgmodule-2.0.so* \
                "$workdir"/squashfs-root/usr/lib/libmount.so* \
                "$workdir"/squashfs-root/usr/lib/libblkid.so* \
                "$workdir"/squashfs-root/usr/lib/libselinux.so* \
                "$workdir"/squashfs-root/usr/lib/libpcre2-8.so* \
                "$workdir"/squashfs-root/usr/lib/libzstd.so* \
                "$workdir"/squashfs-root/usr/lib/libelf.so* \
                "$workdir"/squashfs-root/usr/lib/libffi.so*

          curl -sL -o "$workdir/appimagetool.AppImage" \
            https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x "$workdir/appimagetool.AppImage"
          rm -f "$appimage_path"
          ARCH=x86_64 "$workdir/appimagetool.AppImage" --appimage-extract-and-run \
            "$workdir/squashfs-root" "$appimage_path"
          rm -rf "$workdir"

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: lockbox-${{ matrix.platform }}
          path: |
            src-tauri/target/release/bundle/
            src-tauri/target/release/Lockbox.exe
            src-tauri/target/release/Lockbox
          if-no-files-found: warn
          retention-days: 14

  # Only runs when a v* tag is pushed manually — ordinary pushes/PRs just
  # build and stop at the artifacts above. This is a fallback path for
  # cutting a release from a tag by hand; the normal path is
  # auto_tag_and_release below, which fires on every push to main instead.
  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      # Attaches the portable exe plus the MSI and NSIS installer from
      # `bundle/`, and the Linux `.deb` and `.AppImage`, so a release covers
      # every distribution form built above. The in-app self-updater
      # (updates.rs) only ever picks the portable exe on Windows or the
      # `.deb` on Linux — it explicitly skips anything with
      # "setup"/"installer" in the name on Windows, and never looks at the
      # AppImage at all — so adding the installers/AppImage here doesn't
      # affect it (see
      # docs/DISTRIBUTION.md). The binary is always `Lockbox.exe` (matching
      # Cargo.toml's `[[bin]] name`) — an earlier version of this workflow
      # also matched a lowercase `lockbox.exe` pattern on the theory that
      # Windows' case-insensitive filesystem would make upload-artifact
      # produce both casings; it doesn't, so that pattern only ever matched
      # zero files and failed the release outright once
      # `fail_on_unmatched_files` was turned on.
      - name: Create draft GitHub release
        uses: softprops/action-gh-release@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          draft: false
          fail_on_unmatched_files: true
          # Without this, the release body is left empty — GitHub's web UI
          # cosmetically falls back to showing the tagged commit's message
          # in that spot, but that's UI-only and never actually populates
          # the release's real `body` field, which is exactly what the
          # in-app "what's new" popup (updates.rs's get_current_release_notes)
          # reads. This asks GitHub to auto-summarize commits since the
          # previous release instead of leaving it genuinely empty.
          generate_release_notes: true
          files: |
            artifacts/**/Lockbox.exe
            artifacts/**/bundle/msi/*.msi
            artifacts/**/bundle/nsis/*.exe
            artifacts/**/bundle/deb/*.deb
            artifacts/**/bundle/appimage/*.AppImage

  # The normal release path: every push to main checks whether
  # package.json's version has moved past the last tag, and if so, creates
  # that tag and publishes the release itself — no manual `git tag` step.
  # Pushing a fresh commit that doesn't bump the version just builds and
  # stops here (the "tag already exists" check skips the rest), so this
  # only fires on an actual version bump landing on main.
  auto_tag_and_release:
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Determine version and check for an existing tag
        id: version
        shell: bash
        run: |
          VERSION=$(grep -m1 '"version"' package.json | sed -E 's/.*"version":[[:space:]]*"([^"]+)".*/\1/')
          if [ -z "$VERSION" ]; then
            echo "Could not read version from package.json" >&2
            exit 1
          fi
          TAG="v${VERSION}"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          if git ls-remote --exit-code --tags origin "refs/tags/${TAG}" > /dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Download all build artifacts
        if: steps.version.outputs.exists == 'false'
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create and push tag
        if: steps.version.outputs.exists == 'false'
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag "${{ steps.version.outputs.tag }}"
          git push origin "${{ steps.version.outputs.tag }}"

      - name: Create GitHub release
        if: steps.version.outputs.exists == 'false'
        uses: softprops/action-gh-release@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          tag_name: ${{ steps.version.outputs.tag }}
          draft: false
          fail_on_unmatched_files: true
          generate_release_notes: true
          files: |
            artifacts/**/Lockbox.exe
            artifacts/**/bundle/msi/*.msi
            artifacts/**/bundle/nsis/*.exe
            artifacts/**/bundle/deb/*.deb
            artifacts/**/bundle/appimage/*.AppImage

  publish_optional:
    needs: build
    if: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.publish_release == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create draft GitHub release (manual publish)
        uses: softprops/action-gh-release@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          draft: false
          fail_on_unmatched_files: true
          generate_release_notes: true
          files: |
            artifacts/**/Lockbox.exe
            artifacts/**/bundle/msi/*.msi
            artifacts/**/bundle/nsis/*.exe
            artifacts/**/bundle/deb/*.deb
            artifacts/**/bundle/appimage/*.AppImage
