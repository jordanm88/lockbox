name: Build Lockbox

permissions:
  contents: write

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      publish_release:
        description: 'If true, create a draft GitHub release with the build artifacts (disabled by default)'
        required: false
        default: 'false'

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        platform: [windows-latest]
    runs-on: ${{ matrix.platform }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri"

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install frontend dependencies
        run: npm ci

      - name: Type-check frontend
        run: npx tsc --noEmit

      # Plain `tauri build`, not tauri-action — keeps this job's only
      # responsibility "produce bundles for this OS", with no dependence on
      # GitHub-release-specific behavior that's harder to verify locally.
      - name: Build Tauri app
        run: npm run tauri -- build

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: lockbox-${{ matrix.platform }}
          path: |
            src-tauri/target/release/bundle/
            src-tauri/target/release/Lockbox
            src-tauri/target/release/Lockbox.exe
            src-tauri/target/release/lockbox
            src-tauri/target/release/lockbox.exe
          if-no-files-found: warn
          retention-days: 14

  # Only runs when a v* tag is pushed — ordinary pushes/PRs just build and
  # stop at the artifacts above. Attaches every platform's raw build output
  # to a draft release; run scripts/package-usb.* locally afterward to turn
  # a downloaded artifact into an actual USB layout (see docs/DISTRIBUTION.md).
  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      # Only the raw portable exe, not the whole artifact tree — `bundle/`
      # also contains the MSI/NSIS installers, which aren't what the
      # in-app updater downloads and were never the intended distribution
      # artifact for a portable app (see docs/DISTRIBUTION.md). Matching
      # both casings since the exact binary name has moved between
      # `lockbox.exe` and `Lockbox.exe` across earlier changes.
      - name: Create draft GitHub release
        uses: softprops/action-gh-release@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          draft: false
          fail_on_unmatched_files: true
          files: |
            artifacts/**/Lockbox.exe
            artifacts/**/lockbox.exe

  publish_optional:
    needs: build
    if: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.publish_release == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create draft GitHub release (manual publish)
        uses: softprops/action-gh-release@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          draft: false
          fail_on_unmatched_files: true
          files: |
            artifacts/**/Lockbox.exe
            artifacts/**/lockbox.exe
