name: Build Lockbox

permissions:
  contents: write

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      publish_release:
        description: 'If true, create a draft GitHub release with the build artifacts (disabled by default)'
        required: false
        default: 'false'

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        platform: [windows-latest]
    runs-on: ${{ matrix.platform }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri"

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install frontend dependencies
        run: npm ci

      - name: Type-check frontend
        run: npx tsc --noEmit

      # Plain `tauri build`, not tauri-action — keeps this job's only
      # responsibility "produce bundles for this OS", with no dependence on
      # GitHub-release-specific behavior that's harder to verify locally.
      - name: Build Tauri app
        run: npm run tauri -- build

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: lockbox-${{ matrix.platform }}
          path: |
            src-tauri/target/release/bundle/
            src-tauri/target/release/Lockbox.exe
          if-no-files-found: warn
          retention-days: 14

  # Only runs when a v* tag is pushed manually — ordinary pushes/PRs just
  # build and stop at the artifacts above. This is a fallback path for
  # cutting a release from a tag by hand; the normal path is
  # auto_tag_and_release below, which fires on every push to main instead.
  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      # Attaches the portable exe plus the MSI and NSIS installer from
      # `bundle/`, so a release covers all three distribution forms. The
      # in-app self-updater (updates.rs) only ever picks the portable exe —
      # it explicitly skips anything with "setup"/"installer" in the name —
      # so adding the installers here doesn't affect it (see
      # docs/DISTRIBUTION.md). The binary is always `Lockbox.exe` (matching
      # Cargo.toml's `[[bin]] name`) — an earlier version of this workflow
      # also matched a lowercase `lockbox.exe` pattern on the theory that
      # Windows' case-insensitive filesystem would make upload-artifact
      # produce both casings; it doesn't, so that pattern only ever matched
      # zero files and failed the release outright once
      # `fail_on_unmatched_files` was turned on.
      - name: Create draft GitHub release
        uses: softprops/action-gh-release@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          draft: false
          fail_on_unmatched_files: true
          files: |
            artifacts/**/Lockbox.exe
            artifacts/**/bundle/msi/*.msi
            artifacts/**/bundle/nsis/*.exe

  # The normal release path: every push to main checks whether
  # package.json's version has moved past the last tag, and if so, creates
  # that tag and publishes the release itself — no manual `git tag` step.
  # Pushing a fresh commit that doesn't bump the version just builds and
  # stops here (the "tag already exists" check skips the rest), so this
  # only fires on an actual version bump landing on main.
  auto_tag_and_release:
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Determine version and check for an existing tag
        id: version
        shell: bash
        run: |
          VERSION=$(grep -m1 '"version"' package.json | sed -E 's/.*"version":[[:space:]]*"([^"]+)".*/\1/')
          if [ -z "$VERSION" ]; then
            echo "Could not read version from package.json" >&2
            exit 1
          fi
          TAG="v${VERSION}"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          if git ls-remote --exit-code --tags origin "refs/tags/${TAG}" > /dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Download all build artifacts
        if: steps.version.outputs.exists == 'false'
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create and push tag
        if: steps.version.outputs.exists == 'false'
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag "${{ steps.version.outputs.tag }}"
          git push origin "${{ steps.version.outputs.tag }}"

      - name: Create GitHub release
        if: steps.version.outputs.exists == 'false'
        uses: softprops/action-gh-release@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          tag_name: ${{ steps.version.outputs.tag }}
          draft: false
          fail_on_unmatched_files: true
          files: |
            artifacts/**/Lockbox.exe
            artifacts/**/bundle/msi/*.msi
            artifacts/**/bundle/nsis/*.exe

  publish_optional:
    needs: build
    if: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.publish_release == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create draft GitHub release (manual publish)
        uses: softprops/action-gh-release@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          draft: false
          fail_on_unmatched_files: true
          files: |
            artifacts/**/Lockbox.exe
            artifacts/**/bundle/msi/*.msi
            artifacts/**/bundle/nsis/*.exe
