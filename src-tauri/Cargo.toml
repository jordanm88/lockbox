[package]
name = "lockbox"
version = "0.2.24"
description = "Lockbox — portable encrypted USB vault"
edition = "2021"

[lib]
name = "lockbox_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "Lockbox"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["image-png"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
argon2 = "0.5"
chacha20poly1305 = "0.10"
rand = "0.8"
zeroize = { version = "1", features = ["derive"] }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
zip = "2"
tar = "0.4"
flate2 = "1"
sha2 = "0.10"
hex = "0.4"
tokio = { version = "1", features = ["process", "io-util", "rt"] }
fs4 = "0.9"
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
hmac = "0.12"
sha1 = "0.10"
base32 = "0.5"
pdf-extract = "0.12"

[target.'cfg(target_os = "linux")'.dependencies]
rfd = { version = "0.15", default-features = false, features = ["gtk3"] }

# opt-level = 3 (speed), not "s"/"z" (size): this is a portable app meant to
# run comfortably off a USB drive, where a few extra MB on disk costs
# nothing noticeable, but every unlock runs Argon2id key derivation and
# every vault operation runs ChaCha20Poly1305 + zip/tar extraction for app
# installs — all CPU-bound work that a size-optimized build measurably
# slows down for no benefit here.
[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = 3
strip = true
